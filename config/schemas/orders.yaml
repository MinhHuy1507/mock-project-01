table_name: orders
schema_name: retail
prefix: orders/

rcv_format: csv
l0_format: csv
l1_format: parquet
audit_format: csv

rcv_layer: rcv
l0_layer: l0
l1_layer: l1
audit_layer: audit

stage_l0: stage_l0
stage_l1: stage_l1
stage_audit: stage_audit

columns:
- name: id
  type: string
- name: customer_id
  type: string
- name: product_id
  type: string
- name: quantity
  type: int
- name: price
  type: decimal
- name: order_date
  type: datetime

rcv_to_l0:
  validation:
    validate_file: true
    validate_schema: true

  transformation:
    add_column:
      - name: process_date
        type: datetime
      - name: source_file
        type: string
    
l0_to_l1:
  validation:
    - rule: not_null
      column: [id, customer_id, product_id, quantity, price, order_date]
    - rule: range
      column: quantity
      min: 0
      max: 9999
    - rule: range
      column: price
      min: 0
      max: 9999999
    - rule: unique
      column: id
    - rule: unique
      column: [customer_id, product_id] 

  transformation:
    rename:
      - from: id
        to: order_id 
    filter_columns:
      - output: [order_id, customer_id, product_id, quantity, price, order_date, process_date, source_file]

load_database:
  load_strategy: append_only
  primary_key: order_id