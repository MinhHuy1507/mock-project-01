table_name: products
schema_name: retail
prefix: products/

rcv_format: csv
l0_format: csv
l1_format: parquet
audit_format: csv

rcv_layer: rcv
l0_layer: l0
l1_layer: l1
audit_layer: audit

columns:
- name: id
  type: string
- name: name
  type: string
- name: unit_price
  type: decimal

rcv_to_l0:
  validation:
    validate_file: true
    validate_schema: true

  transformation:
    add_column:
      - name: process_date
        type: datetime
      - name: source_file
        type: string
    
l0_to_l1:
  validation:
    - rule: not_null
      column: [id, name, unit_price]
    - rule: range
      column: unit_price
      min: 0
      max: 9999999
    - rule: unique
      column: id

  transformation:
    rename:
      - from: id
        to: product_id
      - from: name
        to: product_name
    filter_columns:
      - output: [product_id, product_name, unit_price, process_date, source_file]

load_database:
  load_strategy: truncate_and_insert
  primary_key: customer_id