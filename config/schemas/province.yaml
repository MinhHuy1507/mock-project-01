table_name: province
schema_name: retail
prefix: province/

rcv_format: csv
l0_format: csv
l1_format: parquet
audit_format: csv

rcv_layer: rcv
l0_layer: l0
l1_layer: l1
audit_layer: audit

columns:
- name: id
  type: string
- name: name
  type: string

rcv_to_l0:
  validation:
    validate_file: true
    validate_schema: true

  transformation:
    add_column:
      - name: process_date
        type: datetime
      - name: source_file
        type: string
    
l0_to_l1:
  validation:
    - rule: not_null
      column: [id, name]

  transformation:
    rename:
      - from: id
        to: province_id
      - from: name
        to: province_name
    filter_columns:
      - output: [province_id, province_name, process_date, source_file]

load_database:
  load_strategy: truncate_and_insert
  primary_key: customer_id