rcv_to_l0:
  validate_file:
    input: context = {"file_path": "rcv/retail/customers/yyyy/mm/dd/customers.csv", table_config: customers_config}
    output: 
      - case 1 (sai path): File not found: {file_path}
      - case 2 (sai suffix): Invalid file format {file_path}. Expected file format {suffix}
      - case 3 (File không đọc được): File is not readable: {str(e)}
      - case 4 (File empty): File empty: {file_path}

  validate_schema:
    input: context = {"df": customers_df, table_config: customers_config}
    output:
      - case 1 (customers_df.columns < customers_config columns): "Schema drift detected. Missing columns: {list(missing_columns)}"
      - case 2 (customers_df.columns > customers_config columns): "Schema drift detected. Unexpected columns: {list(extra_columns)}"
      - case 3 (thêm columns mới, và mất columns cũ): "Schema drift detected. Missing columns: {list(missing_columns)}. Unexpected columns: {list(extra_columns)}"

  add_columns:
    input: context = {"df": customers_df, "file_path": customers_path}, transform_rules=["process_date", "source_file"]
    output:
      - expected: customers_df có thêm 2 cột process_date và source_file
  

l0_to_l1:
  validate_not_null:
    input: df= pd.DataFrame({"id": [1, None, 3]}), column="id"
    logic: mask = df[column].notna()
    output: mask = [True, False, True]
    Analogy: valid_df = df[mask] -> sẽ lọc được những record valid non-null

  validate_unique:
    input: df= pd.DataFrame({"id": [1, None, 1, 3, None]}), column="id"
    logic: mask = ~df[column].duplicated(keep=False) | df[column].isna()
    output: mask = [False, True, False, True, True]
    Analogy: Loại những records trùng (dù lần 1 hay n), cho null pass (chỉ xử lý ở not null)

  validate_range:
    input: df= pd.DataFrame({"kpi": [-1, 0, 100, 50, None]}), column="kpi", min=0, max=100
    logic: mask = ((df[column] >= min) & (df[column] <= max)) | df[column].isna()
    output: mask = [False, True, True, True, True]
    Analogy: cho null pass (not null sẽ handle)

  validate_format:
    input: df= pd.DataFrame({"birthdate": [None, "2005-07-15", "2005/07/15"]}), column="birthdate", format="yyyy-mm-dd"
    output: mask = [True, True, False]
    Analogy: cho null pass (not null sẽ handle)

  validate_datatype:
    input: df= pd.DataFrame({"kpi": [90, 90.1, None, "90"]}), column="kpi", col_type="decimal"
    output: mask = [True, True, True, False]
    Analogy: cho null pass (not null sẽ handle)

  split_customers_name:
    input: context = {"df": customers_df}, transform_rules = {"from": "name", "to": ["first_name", "last_name"]}
    output:
      - case 1: name=None -> first_name = last_name = None
      - case 2: name="Huy Ngo" -> first_name = "Huy", last_name = "Ngo"
      - case 3: name="Huy Ngo Minh" -> first_name = "Huy", last_name = "Ngo Minh"
      - case 4: name="Huy" -> first_name = "Huy", last_name = None

  split_customers_address:
    input: context = {"df": customers_df}, transform_rules = {"from": "address", "to": ["address", "address_province"]}
    output:
      - case 1: address=None -> address = address_province = None
      - case 2: address="123 Nguyen Ai Quoc, Ho Chi Minh" -> address = "123 Nguyen Ai Quoc, Ho Chi Minh", address_province ="Ho Chi Minh"
      - case 3: address="123 Nguyen Ai Quoc" -> address = "123 Nguyen Ai Quoc", address_province=None
      - case 4: address="Ho Chi Minh" -> address = "Ho Chi Minh", address_province = None
      - case 5: address=",123 Nguyen Ai Quoc, Ho Chi Minh," -> address = "123 Nguyen Ai Quoc, Ho Chi Minh", address_province ="Ho Chi Minh"

  rename_columns:
    input: context = {"df": customers_df}, transform_rules = {"from": "id", "to": "customer_id"}
    output:
      - case: cột id -> customer_id, id sẽ ko còn trong customers_df
