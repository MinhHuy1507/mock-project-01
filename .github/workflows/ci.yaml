name: test and build

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  
jobs:
  test_and_build:
    name: test format code and build dependencies
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4
      
      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          #cache: "pip"

      - name: install dependencies for python
        run: |
          python -m pip install --upgrade pip
          pip install black pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: test format code with black
        run: black --check .

      - name: test code with unit tests
        run: |
          if [ -d tests/ ]; then pytest tests/ -v; fi